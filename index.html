<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Kämpf – Videographer & Video Producer</title>
  <style>
    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #111;
      font-family: Helvetica, Arial, sans-serif;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4.8rem);
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: clamp(1rem, 2.3vw, 1.35rem);
      color: #555;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #111;
      margin: 46px 0;
    }

    .services {
      margin: 0;
      max-width: 780px;
      font-size: clamp(1rem, 2.2vw, 1.18rem);
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    footer {
      flex-shrink: 0;
      text-align: center;
      padding: 18px 16px 22px;
      border-top: 1px solid #eee;
    }

    footer a {
      color: #111;
      text-decoration: underline;
      font-size: 0.95rem;
    }

    @media (max-width: 520px) {
      main {
        padding: 28px 20px;
      }

      .divider {
        margin: 36px 0;
      }

      .services {
        max-width: 320px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Simon Kämpf</h1>
    <p class="subtitle">Videographer &amp; Video Producer</p>

    <div class="divider"></div>

    <p class="services">
      Corporate Video · Social Media · Internal Communications · Concept · Production · Postproduction
    </p>
  </main>

  <footer>
    <a href="impressum.html">Impressum</a>
  </footer>
</body>
</html>
