<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum – Simon Kämpf</title>
  <style>
    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #111;
      font-family: Helvetica, Arial, sans-serif;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      box-sizing: border-box;
    }

    .imprint {
      width: 100%;
      max-width: 620px;
      text-align: center;
    }

    h1 {
      margin: 0 0 34px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    .section {
      margin-top: 28px;
    }

    .section:first-of-type {
      margin-top: 0;
    }

    p {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.1rem);
      line-height: 1.7;
    }

    a {
      color: #111;
    }

    footer {
      flex-shrink: 0;
      text-align: center;
      padding: 18px 16px 22px;
      border-top: 1px solid #eee;
    }

    footer a {
      color: #111;
      text-decoration: underline;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="imprint">
      <h1>Impressum</h1>

      <div class="section">
        <p>
          Simon Kämpf<br>
          Ringseisstr. 11<br>
          80337 München
        </p>
      </div>

      <div class="section">
        <p>
          E-Mail:
          <a href="mailto:connect@simonkaempf.de">connect@simonkaempf.de</a>
        </p>
      </div>
    </div>
  </main>

  <footer>
    <a href="index.html">Zurück</a>
  </footer>
</body>
</html>
