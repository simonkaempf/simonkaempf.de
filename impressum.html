<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Impressum · Simon Kämpf</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Helvetica, Arial, sans-serif;
      color: #111;
      background: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      padding: clamp(24px, 5vw, 64px);
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      width: min(100%, 640px);
      padding: clamp(2rem, 8vw, 6rem) 0;
    }

    h1 {
      margin: 0 0 clamp(2.5rem, 7vw, 4rem);
      font-size: clamp(2.4rem, 8vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    h2 {
      margin: 2.5rem 0 0.6rem;
      font-size: 1rem;
    }

    p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.6;
    }

    address {
      font-style: normal;
    }

    .placeholder {
      color: #666;
    }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
    }

    a:hover,
    a:focus-visible {
      text-decoration-thickness: 2px;
    }

    footer {
      padding-top: 2rem;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Impressum</h1>

    <h2>Angaben gemäß § 5 DDG</h2>
    <address>
      <p>
        Simon Kämpf<br>
        <span class="placeholder">[STRASSE UND HAUSNUMMER]</span><br>
        <span class="placeholder">[PLZ ORT]</span>
      </p>
    </address>

    <h2>Kontakt</h2>
    <p>E-Mail: <a href="mailto:connect@simonkaempf.de">connect@simonkaempf.de</a></p>
  </main>

  <footer>
    <a href="index.html">Zurück zur Startseite</a>
  </footer>
</body>
</html>
